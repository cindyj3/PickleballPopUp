<!DOCTYPE html>
<html>

<head>
    <title>Pop-Up Pickleball</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            background: #f6f8f7;
        }

        /* NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 16px 40px;
            background: white;
            border-bottom: 1px solid #eee;
        }

        .logo {
            font-weight: bold;
            color: #1f8f5f;
        }

        .nav-links span {
            margin-left: 20px;
            color: #666;
            cursor: pointer;
        }

        .nav-links span.active {
            color: #1f8f5f;
            font-weight: 600;
        }

        /* HERO */
        .hero {
            background: linear-gradient(135deg, #e8f7ef, #f4fbf7);
            text-align: center;
            padding: 60px 20px;
            border-radius: 20px;
            margin: 30px auto;
            max-width: 900px;
        }

        .hero h1 {
            font-size: 40px;
        }

        .hero span {
            color: #1f8f5f;
        }

        .hero p {
            color: #666;
        }

        /* BUTTONS */
        button {
            border-radius: 10px;
            border: none;
            padding: 10px 16px;
            cursor: pointer;
            margin: 5px;
        }

        .primary {
            background: #1f8f5f;
            color: white;
        }

        .outline {
            border: 2px solid #1f8f5f;
            background: white;
            color: #1f8f5f;
        }

        /* CONTAINER */
        .container {
            max-width: 900px;
            margin: auto;
        }

        /* GRID */
        #gamesList {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        /* CARD */
        .game-card {
            background: white;
            padding: 18px;
            border-radius: 14px;
            border: 1px solid #eee;
        }

        .status {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .scheduled {
            background: #e8f7ef;
            color: #1f8f5f;
        }

        .completed {
            background: #fdecea;
            color: #c0392b;
        }

        input, select {
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            width: 100%;
            margin-top: 10px;
        }

        .page {
            display: none;
        }

        .active-page {
            display: block;
        }

    </style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">Pop-Up</div>
    <div class="nav-links">
        <span onclick="switchPage('home')" class="active">Home</span>
        <span onclick="switchPage('browse')">Browse</span>
        <span onclick="switchPage('create')">Create</span>
        <span onclick="switchPage('profile')">Profile</span>
    </div>
</div>

<div class="container">

    <!-- HOME -->
    <div id="home" class="page active-page">
        <div class="hero">
            <h1>Find Your Next <span>Pickleball Game</span></h1>
            <p>Connect with players and organize games easily</p>

            <button class="primary" onclick="switchPage('browse')">Browse Games</button>
            <button class="outline" onclick="switchPage('create')">Create Game</button>
        </div>
    </div>

    <!-- BROWSE -->
    <div id="browse" class="page">
        <h2>Available Games</h2>
        <input id="searchInput" placeholder="Search location..." oninput="loadGames()">
        <div id="gamesList"></div>
    </div>

    <!-- CREATE -->
    <div id="create" class="page">
        <h2>Create Game</h2>

        <input id="location" placeholder="Location">
        <input id="time" type="datetime-local">

        <select id="gameType">
            <option value="singles">Singles</option>
            <option value="doubles">Doubles</option>
        </select>

        <button id="createBtn" class="primary" onclick="createGame()">Create</button>
    </div>

    <!-- PROFILE -->
    <div id="profile" class="page">
        <h2>Profile</h2>
        <p id="userDisplay"></p>

        <input id="usernameInput" placeholder="Enter name">
        <button class="primary" onclick="login()">Sign In</button>
        <button onclick="logout()">Sign Out</button>
    </div>

</div>

<script>

const API = "https://pickleballpopup.onrender.com/api";

let username = localStorage.getItem("username");

function switchPage(page) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active-page"));
    document.getElementById(page).classList.add("active-page");
}

function updateUserDisplay() {
    document.getElementById("userDisplay").innerText =
        username ? "Signed in as: " + username : "Not signed in";
}

updateUserDisplay();

function login() {
    const input = document.getElementById("usernameInput").value;
    username = input;
    localStorage.setItem("username", username);
    updateUserDisplay();
}

function logout() {
    localStorage.removeItem("username");
    username = null;
    updateUserDisplay();
}

async function loadGames() {

    const container = document.getElementById("gamesList");
    container.innerHTML = "Loading...";

    const res = await fetch(API + "/games");
    const games = await res.json();

    container.innerHTML = "";

    for (const game of games) {

        const playersRes = await fetch(API + `/games/${game.GID}/players`);
        const players = await playersRes.json();

        const names = players.map(p => p.Username);
        const joined = username && names.includes(username);
        const isFull = names.length >= 4;

        const now = new Date();
        const gameTime = new Date(game.GameTime);

        const canRecord =
            username &&
            game.Status === "scheduled" &&
            gameTime <= now &&
            names.length >= 2;

        const div = document.createElement("div");
        div.className = "game-card";

        div.innerHTML = `
            <div style="display:flex; justify-content:space-between;">
                <strong>${game.Location}</strong>
                <span class="status ${game.Status}">
                    ${game.Status}
                </span>
            </div>

            <p>${new Date(game.GameTime).toLocaleString()}</p>
            <p>${names.length}/4 players</p>
            <p>${names.join(", ") || "No players yet"}</p>

            ${username && !joined && !isFull
                ? `<button class="primary" onclick="joinGame(${game.GID})">Join</button>`
                : ""}

            ${joined
                ? `<button class="outline" onclick="leaveGame(${game.GID})">Leave</button>`
                : ""}

            ${canRecord
                ? `<button class="primary" onclick="recordResult(${game.GID})">Record</button>`
                : ""}
        `;

        container.appendChild(div);
    }
}

async function createGame() {

    const btn = document.getElementById("createBtn");
    btn.disabled = true;
    btn.innerText = "Creating...";

    const location = document.getElementById("location").value;
    const time = document.getElementById("time").value;
    const type = document.getElementById("gameType").value;

    const res = await fetch(API + "/games", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ location, time, type })
    });

    const data = await res.json();

    alert(data.error || "Game created");

    btn.disabled = false;
    btn.innerText = "Create";

    loadGames();
}

async function joinGame(id) {
    await fetch(API + `/games/${id}/join`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username })
    });

    loadGames();
}

async function leaveGame(id) {
    await fetch(API + `/games/${id}/leave`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username })
    });

    loadGames();
}

async function recordResult(id) {
    const winner = prompt("Enter winner name");
    if (!winner) return;

    await fetch(API + `/games/${id}/result`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ winner })
    });

    loadGames();
}

setInterval(loadGames, 5000);

</script>

</body>
</html>
