<!-- SAME FILE BUT UPDATED loadGames + recordResult + leaderboard -->

<script>
    const API = "https://pickleballpopup.onrender.com/api";
    let username = localStorage.getItem("username");
    
    window.onload = () => {
        if (username) document.getElementById("userDisplay").innerText = username;
    };
    
    async function loadGames() {
        const res = await fetch(API + "/games");
        const games = await res.json();
    
        const container = document.getElementById("gamesList");
        container.innerHTML = "";
    
        for (let game of games) {
            const playersRes = await fetch(API + `/games/${game.GID}/players`);
            const players = await playersRes.json();
            const names = players.map(p => p.Username);
    
            const isCreator = game.CreatedBy === username;
            const isFull = names.length >= 4;
    
            const div = document.createElement("div");
    
            div.innerHTML = `
                <h3>${game.Location}</h3>
                <p>${new Date(game.GameTime).toLocaleString()}</p>
    
                <p><b>Players (${names.length}/4):</b> ${names.join(", ") || "None"}</p>
                ${isFull ? "<p style='color:red;'>Roster Full</p>" : ""}
    
                ${username && !names.includes(username) && !isFull
                    ? `<button onclick="joinGame(${game.GID})">Join</button>` : ""}
    
                ${names.includes(username)
                    ? `<button onclick="leaveGame(${game.GID})">Leave</button>` : ""}
    
                ${isCreator && game.Status === "scheduled"
                    ? `
                    <select id="winner-${game.GID}">
                        ${names.map(n => `<option value="${n}">${n}</option>`).join("")}
                    </select>
                    <input id="score-${game.GID}" placeholder="11-7">
                    <button onclick="recordResult(${game.GID})">Record</button>
                    ` : ""}
            `;
    
            container.appendChild(div);
        }
    }
    
    async function recordResult(id) {
        const winner = document.getElementById(`winner-${id}`).value;
        const score = document.getElementById(`score-${id}`).value;
    
        const res = await fetch(API + `/games/${id}/result`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ winner, score })
        });
    
        const data = await res.json();
    
        if (data.error) alert(data.error);
        else alert("Recorded!");
    
        loadGames();
        loadLeaderboard();
    }
    
    async function loadLeaderboard() {
        const res = await fetch(API + "/games/leaderboard");
        const data = await res.json();
    
        document.getElementById("leaderboard").innerHTML =
            data.map((p, i) => {
                const pct = p.totalGames
                    ? ((p.wins / p.totalGames) * 100).toFixed(1)
                    : 0;
    
                return `<div>#${i+1} ${p.Username} | Wins: ${p.wins} | ${pct}%</div>`;
            }).join("");
    }
    </script>
