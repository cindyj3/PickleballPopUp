<!DOCTYPE html>
<html>

<head>
  <title>Pickleball PopUp</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f4f6f8;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      color: #2c3e50;
      margin-bottom: 5px;
    }

    .user {
      color: #555;
      margin-bottom: 20px;
    }

    input {
      padding: 10px;
      margin-right: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      padding: 10px 16px;
      background: #2ecc71;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 6px;
    }

    button:hover {
      background: #27ae60;
    }

    button:disabled {
      background: gray;
      cursor: not-allowed;
    }

    #gamesList {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
    }

    .game-card {
      background: white;
      padding: 16px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .players {
      margin-top: 10px;
      font-size: 14px;
      color: #333;
    }

    .status {
      margin-top: 10px;
      color: green;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Pickleball PopUp</h1>
  <p id="userDisplay" class="user"></p>

  <h2>Create Game</h2>

  <input id="location" placeholder="Enter location">
  <input id="time" type="datetime-local">
  <button onclick="createGame()">Create Game</button>

  <p id="statusMessage" class="status"></p>

  <h2>Available Games</h2>

  <button onclick="loadGames()">Refresh Games</button>

  <div id="gamesList"></div>

</div>

<script>

const API = "https://pickleballpopup.onrender.com/api"

let username = localStorage.getItem("username");

if (!username) {
  username = prompt("Enter your name:");
  if (username) {
    localStorage.setItem("username", username);
  }
}

document.getElementById("userDisplay").innerText = "Logged in as: " + username;

window.onload = loadGames;

async function loadGames() {
  try {
    const res = await fetch(API + "/games");
    const games = await res.json();

    const list = document.getElementById("gamesList");
    list.innerHTML = "";

    for (const game of games) {

      const playersRes = await fetch(API + `/games/${game.GID}/players`);
      const players = await playersRes.json();

      const playerNames = players.map(p => p.Username);
      const joined = playerNames.includes(username);

      const div = document.createElement("div");
      div.className = "game-card";

      div.innerHTML = `
        <h3>${game.Location}</h3>
        <p><strong>Time:</strong> ${formatTime(game.GameTime)}</p>

        <p class="players">
          ${playerNames.length} player(s)<br>
          ${playerNames.join(", ") || "No players yet"}
        </p>

        <button 
          onclick="joinGame(${game.GID})" 
          ${joined ? "disabled" : ""}
        >
          ${joined ? "Joined" : "Join Game"}
        </button>
      `;

      list.appendChild(div);
    }

  } catch (err) {
    console.error(err);
  }
}

function formatTime(time) {
  if (!time) return "";
  return new Date(time).toLocaleString();
}

async function createGame() {

  const location = document.getElementById("location").value;
  const time = document.getElementById("time").value;

  if (!location || !time) {
    alert("Please fill out all fields");
    return;
  }

  try {
    const res = await fetch(API + "/games", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        location,
        time
      })
    });

    await res.json();

    document.getElementById("location").value = "";
    document.getElementById("time").value = "";

    document.getElementById("statusMessage").innerText = "Game created";

    loadGames();

  } catch (err) {
    console.error(err);
  }
}

async function joinGame(gameId) {

  if (!username) {
    alert("No username found.");
    return;
  }

  try {
    const res = await fetch(API + "/games/" + gameId + "/join", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username })
    });

    const data = await res.json();

    document.getElementById("statusMessage").innerText =
      data.message || "Joined game";

    loadGames();

  } catch (err) {
    console.error(err);
  }
}

setInterval(loadGames, 5000);

</script>

</body>
</html>
