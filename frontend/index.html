<!DOCTYPE html>
<html>

<head>
    <title>Pop-Up Pickleball</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            background: #f6f8f7;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 16px 40px;
            background: white;
            border-bottom: 1px solid #eee;
        }

        .logo {
            font-weight: bold;
            color: #1f8f5f;
        }

        .nav-links span {
            margin-left: 20px;
            color: #666;
            cursor: pointer;
        }

        .nav-links span.active {
            color: #1f8f5f;
            font-weight: 600;
        }

        .hero {
            background: linear-gradient(135deg, #e8f7ef, #f4fbf7);
            text-align: center;
            padding: 60px 20px;
            border-radius: 20px;
            margin: 30px auto;
            max-width: 900px;
        }

        .hero h1 span {
            color: #1f8f5f;
        }

        button {
            border-radius: 10px;
            border: none;
            padding: 10px 16px;
            cursor: pointer;
            margin: 5px;
        }

        .primary {
            background: #1f8f5f;
            color: white;
        }

        .outline {
            border: 2px solid #1f8f5f;
            background: white;
            color: #1f8f5f;
        }

        .danger {
            background: #e74c3c;
            color: white;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        #gamesList {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: white;
            padding: 18px;
            border-radius: 14px;
            border: 1px solid #eee;
        }

        .leaderboard-card,
        .history-card {
            background: white;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        input,
        select {
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            width: 100%;
            margin-top: 10px;
        }

        .page {
            display: none;
        }

        .active-page {
            display: block;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo">Pop-Up</div>
        <div class="nav-links">
            <span id="navUser" style="margin-right:20px; font-weight:600;"></span>
            <span onclick="switchPage('home')" class="active">Home</span>
            <span onclick="switchPage('browse')">Browse</span>
            <span onclick="switchPage('create')">Create</span>
            <span onclick="switchPage('profile')">Profile</span>
        </div>
    </div>

    <div class="container">

        <div id="home" class="page active-page">
            <div class="hero">
                <h1>Find Your Next <span>Pickleball Game!</span></h1>
                <button class="primary" onclick="switchPage('browse')">Browse</button>
                <button class="outline" onclick="switchPage('create')">Create</button>
            </div>
        </div>

        <div id="browse" class="page">
            <h2>Games</h2>
            <div id="gamesList"></div>

            <h2>Leaderboard</h2>
            <div id="leaderboard"></div>

            <h2>History</h2>
            <div id="history"></div>
        </div>

        <div id="create" class="page">
            <h2>Create Game</h2>
            <input id="location" placeholder="Location">
            <input id="time" type="datetime-local">
            <select id="gameType">
                <option value="singles">Singles</option>
                <option value="doubles">Doubles</option>
            </select>
            <button id="createBtn" class="primary" onclick="createGame()">Create</button>
        </div>

        <div id="profile" class="page">
            <h2>Profile</h2>
            <p id="userDisplay"></p>
            <input id="usernameInput" placeholder="Enter name">
            <button class="primary" onclick="login()">Sign In</button>
            <button onclick="logout()">Sign Out</button>
        </div>

    </div>

    <script>

        const API = "https://pickleballpopup.onrender.com/api";
        let username = localStorage.getItem("username");

        function updateNavbarUser() {
            const nav = document.getElementById("navUser");

            if (username) {
                nav.innerText = `Logged in as ${username}`;
            } else {
                nav.innerText = "";
            }
        }

        window.onload = () => {
            if (username) {
                document.getElementById("userDisplay").innerText = username;
            }

            updateNavbarUser(); // 🔥 add this
        };

        function switchPage(page) {
            document.querySelectorAll(".page").forEach(p => p.classList.remove("active-page"));
            document.getElementById(page).classList.add("active-page");

            if (page === "browse") {
                loadGames();
                loadLeaderboard();
                loadHistory();
            }
        }

        async function login() {
            const input = document.getElementById("usernameInput").value.trim().toLowerCase();

            if (!input) return alert("Please enter a name");

            // ADD THIS RIGHT HERE
            if (username) {
                alert("Already signed in. Please log out first.");
                return;
            }

            const res = await fetch(API + "/games/users");
            const users = await res.json();

            const exists = users.some(u => u.Username === input);

            // allow reuse (no real auth system)
            if (exists) {
                console.log("Existing user logging in");
            }

            username = input;
            localStorage.setItem("username", username);

            document.getElementById("userDisplay").innerText = username;
            document.getElementById("usernameInput").value = "";

            updateNavbarUser();
        }
        function logout() {
            localStorage.removeItem("username");
            username = null;

            document.getElementById("userDisplay").innerText = "";
            document.getElementById("usernameInput").value = "";

            updateNavbarUser();

            alert("Logged out successfully");
        }
        async function loadGames() {
            const container = document.getElementById("gamesList");
            container.innerHTML = "Loading...";

            const res = await fetch(API + "/games");
            const games = await res.json();

            const playerPromises = games.map(g =>
                fetch(API + `/games/${g.GID}/players`).then(r => r.json())
            );

            const playersList = await Promise.all(playerPromises);

            container.innerHTML = "";

            games.forEach((game, i) => {
                if (game.Status === "completed") return; // hide completed games
                const players = playersList[i];
                const names = players.map(p => ({
                    name: p.Username,
                    isWinner: p.IsWinner
                }));
                const winnerExists = names.some(p => p.isWinner);

                const isCreator =
                    game.CreatedBy && username &&
                    game.CreatedBy.toLowerCase() === username.toLowerCase();

                const maxPlayers = game.Type === "singles" ? 2 : 4;
                const isFull = names.length >= maxPlayers;

                const canRecord = names.length === maxPlayers;

                const div = document.createElement("div");
                div.className = "game-card";

                if (winnerExists) {
                    div.style.border = "2px solid green";
                }

                div.innerHTML = `
                    <h3>${game.Location || "No location"}</h3>
                    <p>${new Date(game.GameTime).toLocaleString()}</p>

                    <p><b>Players (${names.length}/${maxPlayers}):</b> ${names.map(p =>
                    p.isWinner
                        ? `<span style="color:green;font-weight:bold;">${p.name} </span>`
                        : p.name
                ).join(", ") || "None"}</p>

                    ${isFull ? `<p style="color:red;">Roster Full</p>` : ""}

                    ${username && !names.some(p => p.name === username) && !isFull
                        ? `<button onclick="joinGame(${game.GID})">Join</button>` : ""}

                    ${username && names.some(p => p.name === username)
                        ? `<button onclick="leaveGame(${game.GID})">Leave</button>` : ""}

                    ${isCreator && game.Status === "scheduled"
                        ? `
                        <div>
                            <select id="winner-${game.GID}">
                                ${names.map(p => `<option value="${p.name}">${p.name}</option>`).join("")}
                            </select>

                            <input id="score-${game.GID}" placeholder="Score (e.g. 11-7)">

                            <button class="primary"
    ${!canRecord ? "disabled" : ""}
    onclick="recordResult(${game.GID})">
    Record Result
</button>
                        </div>
                        ` : ""}

                    ${isCreator
                        ? `<button class="danger" onclick="deleteGame(${game.GID})">Delete</button>` : ""}
                `;

                container.appendChild(div);
            });
        }
        async function recordResult(id) {
            // get players
            const playersRes = await fetch(API + `/games/${id}/players`);
            const players = await playersRes.json();

            // get game info
            const gamesRes = await fetch(API + "/games");
            const games = await gamesRes.json();
            const game = games.find(g => g.GID === id);

            const requiredPlayers = game.Type === "singles" ? 2 : 4;

            // enforce correct player count
            if (players.length !== requiredPlayers) {
                alert(`Need exactly ${requiredPlayers} players to record this game`);
                return;
            }

            // continue as normal
            const winner = document.getElementById(`winner-${id}`).value;
            const score = document.getElementById(`score-${id}`).value;

            const res = await fetch(API + `/games/${id}/result`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ winner, score })
            });

            const data = await res.json();

            if (data.error) alert(data.error);
            else alert("Game recorded!");

            loadGames();
            loadLeaderboard();
            loadHistory();
        }

        async function loadLeaderboard() {
            const res = await fetch(API + "/games/leaderboard");
            const data = await res.json();

            document.getElementById("leaderboard").innerHTML =
                data.map((p, i) => {
                    const pct = p.totalGames
                        ? ((p.wins / p.totalGames) * 100).toFixed(1)
                        : 0;

                    return `
                        <div class="leaderboard-card">
                            #${i + 1} ${p.Username} | Wins: ${p.wins || 0} | ${pct}%
                        </div>
                    `;
                }).join("");
        }

        async function loadHistory() {
            const res = await fetch(API + "/games/history");
            const games = await res.json();

            document.getElementById("history").innerHTML =
                games.map(g => `
                    <div class="history-card">
                        ${g.Location} - ${new Date(g.GameTime).toLocaleString()}
                    </div>
                `).join("");
        }

        async function createGame() {
            if (!username) return alert("Please sign in first");

            const btn = document.getElementById("createBtn");
            if (btn.disabled) return;

            const locationInput = document.getElementById("location").value.trim();
            const time = document.getElementById("time").value;
            const type = document.getElementById("gameType").value;

            if (!locationInput) {
                alert("Location required");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Creating...";

            const res = await fetch(API + "/games", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ location: locationInput, time, type, username })
            });

            const data = await res.json();

            if (data.error) alert(data.error);

            btn.disabled = false;
            btn.innerText = "Create";

            loadGames();
        }

        async function joinGame(id) {
            if (!username) return alert("Please sign in first");

            await fetch(API + `/games/${id}/join`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username })
            });

            loadGames();
        }

        async function leaveGame(id) {
            if (!username) return alert("Please sign in first");

            await fetch(API + `/games/${id}/leave`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username })
            });

            loadGames();
        }

        async function deleteGame(id) {
            if (!username) return alert("Please sign in first");

            await fetch(API + `/games/${id}/delete`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username })
            });

            loadGames();
        }
        // SECRET KEY TO UNLOCK RESET BUTTON
        document.addEventListener("keydown", (e) => {
            if (e.shiftKey && e.key.toLowerCase() === "r") {
                document.getElementById("resetBtn").style.display = "block";
                alert("Reset button unlocked");
            }
        });

        // RESET FUNCTION
        async function resetData() {
            const confirmReset = confirm("Are you sure you want to reset all data?");
            if (!confirmReset) return;

            await fetch(API + "/games/reset", {
                method: "POST"
            });

            alert("Database reset!");

            loadGames();
            loadLeaderboard();
            loadHistory();
        }

    </script>
    <button id="resetBtn" onclick="resetData()"
        style="display:none; position:fixed; bottom:20px; right:20px; background:red; color:white; z-index:999;">
        Reset Demo Data
    </button>
</body>

</html>
