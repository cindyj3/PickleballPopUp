<!DOCTYPE html>
<html>

<head>
    <title>Pop-Up Pickleball</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            background: #f6f8f7;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 16px 40px;
            background: white;
            border-bottom: 1px solid #eee;
        }

        .logo {
            font-weight: bold;
            color: #1f8f5f;
        }

        .nav-links span {
            margin-left: 20px;
            color: #666;
            cursor: pointer;
        }

        .nav-links span.active {
            color: #1f8f5f;
            font-weight: 600;
        }

        .hero {
            background: linear-gradient(135deg, #e8f7ef, #f4fbf7);
            text-align: center;
            padding: 60px 20px;
            border-radius: 20px;
            margin: 30px auto;
            max-width: 900px;
        }

        button {
            border-radius: 10px;
            border: none;
            padding: 10px 16px;
            cursor: pointer;
            margin: 5px;
        }

        .primary { background: #1f8f5f; color: white; }
        .outline { border: 2px solid #1f8f5f; background: white; color: #1f8f5f; }
        .danger { background: #e74c3c; color: white; }

        .container { max-width: 900px; margin: auto; }

        #gamesList {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: white;
            padding: 18px;
            border-radius: 14px;
            border: 1px solid #eee;
        }

        .leaderboard-card,
        .history-card {
            background: white;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        input {
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            width: 100%;
            margin-top: 10px;
        }

        .page { display: none; }
        .active-page { display: block; }
    </style>
</head>

<body>

<div class="navbar">
    <div class="logo">Pop-Up</div>
    <div class="nav-links">
        <span id="navUser" style="margin-right:20px; font-weight:600;"></span>
        <span onclick="switchPage('home')" class="active">Home</span>
        <span onclick="switchPage('browse')">Browse</span>
        <span onclick="switchPage('create')">Create</span>
        <span onclick="switchPage('profile')">Profile</span>
    </div>
</div>

<div class="container">

<div id="home" class="page active-page">
    <div class="hero">
        <h1>Find Your Next <span style="color:#1f8f5f;">Pickleball Game!</span></h1>
        <button class="primary" onclick="switchPage('browse')">Browse</button>
        <button class="outline" onclick="switchPage('create')">Create</button>
    </div>
</div>

<div id="browse" class="page">
    <h2>Events</h2>
    <div id="gamesList"></div>

    <h2>Leaderboard</h2>
    <div id="leaderboard"></div>

    <h2>Match History</h2>
    <div id="history"></div>
</div>

<div id="create" class="page">
    <h2>Create Event</h2>
    <input id="location" placeholder="Location">
    <input id="time" type="datetime-local">
    <button id="createBtn" class="primary" onclick="createGame()">Create</button>
</div>

<div id="profile" class="page">
    <h2>Profile</h2>
    <p id="userDisplay"></p>
    <input id="usernameInput" placeholder="Enter name">
    <button class="primary" onclick="login()">Sign In</button>
    <button onclick="logout()">Sign Out</button>
</div>

</div>

<script>

const API = "https://pickleballpopup.onrender.com/api";
let username = localStorage.getItem("username");

function updateNavbarUser() {
    document.getElementById("navUser").innerText =
        username ? `Logged in as ${username}` : "";
}

window.onload = () => {
    if (username) document.getElementById("userDisplay").innerText = username;
    updateNavbarUser();
};

function switchPage(page) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active-page"));
    document.getElementById(page).classList.add("active-page");

    if (page === "browse") {
        loadGames();
        loadLeaderboard();
        loadHistory();
    }
}

/* LOGIN */
async function login() {
    const input = document.getElementById("usernameInput").value.trim().toLowerCase();
    if (!input) return alert("Enter a name");

    if (username) return alert("Already signed in");

    username = input;
    localStorage.setItem("username", username);

    document.getElementById("userDisplay").innerText = username;
    updateNavbarUser();
}

/* LOGOUT */
function logout() {
    localStorage.removeItem("username");
    username = null;
    document.getElementById("userDisplay").innerText = "";
    updateNavbarUser();
}

/* LOAD EVENTS */
async function loadGames() {
    const res = await fetch(API + "/games");
    const games = await res.json();

    const container = document.getElementById("gamesList");
    container.innerHTML = "";

    for (let game of games) {
        const playersRes = await fetch(API + `/games/${game.GID}/players`);
        const players = await playersRes.json();

        const names = players.map(p => p.Username);

        const isCreator = game.CreatedBy === username;

        const div = document.createElement("div");
        div.className = "game-card";

        div.innerHTML = `
            <h3>${game.Location}</h3>
            <p>${new Date(game.GameTime).toLocaleString()}</p>

            <p><b>Players (${names.length}):</b> ${names.join(", ")}</p>

            ${username && !names.includes(username)
                ? `<button onclick="joinGame(${game.GID})">Join</button>` : ""}

            ${names.includes(username)
                ? `<button onclick="leaveGame(${game.GID})">Leave</button>` : ""}

            ${isCreator
                ? `<button class="primary" onclick="startSubGame(${game.GID})">Start Game</button>` : ""}

            ${isCreator
                ? `<button class="danger" onclick="deleteGame(${game.GID})">Delete</button>` : ""}
        `;

        container.appendChild(div);
    }
}

/* TEAM SPLIT */
function splitTeams(players) {
    const shuffled = [...players].sort(() => 0.5 - Math.random());
    const half = Math.floor(shuffled.length / 2);

    return {
        team1: shuffled.slice(0, half),
        team2: shuffled.slice(half)
    };
}

/* START SUB GAME */
async function startSubGame(id) {
    const res = await fetch(API + `/games/${id}/players`);
    const players = await res.json();

    const names = players.map(p => p.Username);

    const { team1, team2 } = splitTeams(names);

    const winner = prompt(
        `Team 1: ${team1.join(", ")}\nTeam 2: ${team2.join(", ")}\n\nEnter winner:`
    );

    if (!winner) return;

    await fetch(API + `/games/${id}/result`, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
            winner,
            players: [...team1, ...team2]
        })
    });

    loadLeaderboard();
    loadHistory();
}

/* LEADERBOARD */
async function loadLeaderboard() {
    const res = await fetch(API + "/games/leaderboard");
    const data = await res.json();

    document.getElementById("leaderboard").innerHTML =
        data.map(p =>
            `<div class="leaderboard-card">${p.Username} - ${p.wins} wins</div>`
        ).join("");
}

/* HISTORY */
async function loadHistory() {
    const res = await fetch(API + "/games/history");
    const games = await res.json();

    document.getElementById("history").innerHTML =
        games.map(g => `
            <div class="history-card">
                <b>${g.location}</b><br>
                ${g.players.map(p =>
                    p === g.winner
                        ? `<span style="color:green;font-weight:bold;">${p} 🏆</span>`
                        : p
                ).join(", ")}
            </div>
        `).join("");
}

/* CREATE */
async function createGame() {
    const location = document.getElementById("location").value;
    const time = document.getElementById("time").value;

    await fetch(API + "/games", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ location, time, username })
    });

    loadGames();
}

async function joinGame(id) {
    await fetch(API + `/games/${id}/join`, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ username })
    });
    loadGames();
}

async function leaveGame(id) {
    await fetch(API + `/games/${id}/leave`, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ username })
    });
    loadGames();
}

async function deleteGame(id) {
    await fetch(API + `/games/${id}/delete`, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ username })
    });
    loadGames();
}

</script>

</body>
</html>
