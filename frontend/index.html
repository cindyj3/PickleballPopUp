<!DOCTYPE html>
<html>

<head>
    <title>Pop-Up Pickleball</title>

    <style>
        body {
            font-family: -apple-system;
            margin: 0;
            background: #f6f8f7;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 16px 40px;
            background: white;
            border-bottom: 1px solid #eee;
        }

        .logo {
            font-weight: bold;
            color: #1f8f5f;
        }

        .nav-links span {
            margin-left: 20px;
            cursor: pointer;
            color: #666;
        }

        .hero {
            text-align: center;
            padding: 60px 20px;
            background: #e8f7ef;
            border-radius: 20px;
            margin: 30px auto;
        }

        button {
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin: 3px;
        }

        .primary {
            background: #1f8f5f;
            color: white;
        }

        .danger {
            background: #e74c3c;
            color: white;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .game-card,
        .leaderboard-card,
        .history-card {
            background: white;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .page {
            display: none;
        }

        .active-page {
            display: block;
        }

        #chatBox {
            height: 200px;
            overflow: auto;
            background: white;
            padding: 10px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo">Pop-Up</div>
        <div class="nav-links">
            <span id="navUser"></span>
            <span onclick="switchPage('home')">Home</span>
            <span onclick="switchPage('browse')">Browse</span>
            <span onclick="switchPage('create')">Create</span>
            <span onclick="switchPage('profile')">Profile</span>
        </div>
    </div>

    <div class="container">

        <div id="home" class="page active-page">
            <div class="hero">
                <h1>Pickleball Events</h1>
                <button class="primary" onclick="switchPage('browse')">Browse</button>
            </div>
        </div>

        <div id="browse" class="page">
            <h2>Events</h2>
            <button class="danger" onclick="resetAll()">Reset All</button>
            <div class="game-card">
                <h3>Record Match Result</h3>

                <input id="matchGameId" placeholder="Event ID">
                <input id="winnerInput" placeholder="Winner username">
                <input id="playersInput" placeholder="Players (comma separated)">
                <input id="scoreInput" placeholder="Score (e.g. 11-7)">

                <button class="primary" onclick="recordResult()">Submit Result</button>
            </div>
            <div id="gamesList"></div>

            <h2>Leaderboard</h2>
            <div id="leaderboard"></div>

            <h2>Match History</h2>
            <div id="history"></div>

            <h2>Event Chat</h2>
            <div id="chatBox"></div>
            <input id="chatInput" placeholder="Type message...">
            <button onclick="sendMessage()">Send</button>
        </div>

        <div id="create" class="page">
            <h2>Create Event</h2>
            <input id="location" placeholder="Location">
            <input id="time" type="datetime-local">
            <button class="primary" onclick="createGame()">Create</button>
        </div>

        <div id="profile" class="page">
            <h2>Profile</h2>
            <p id="userDisplay"></p>
            <input id="usernameInput" placeholder="Enter name">
            <button onclick="login()">Sign In</button>
            <button onclick="logout()">Sign Out</button>
        </div>

    </div>

    <script>

        const API = "https://pickleballpopup.onrender.com/api";
        let username = localStorage.getItem("username");
        let currentChatGame = null;

        function switchPage(p) {
            document.querySelectorAll(".page").forEach(x => x.classList.remove("active-page"));
            document.getElementById(p).classList.add("active-page");

            if (p === "browse") {
                loadGames();
                loadLeaderboard();
                loadHistory();
            }
        }

        function login() {
            const input = document.getElementById("usernameInput").value.toLowerCase();
            username = input;
            localStorage.setItem("username", username);
            document.getElementById("userDisplay").innerText = username;
        }

        function logout() {
            localStorage.removeItem("username");
            username = null;
            document.getElementById("userDisplay").innerText = "";
        }

        /* LOAD EVENTS */
        async function loadGames() {
            const res = await fetch(API + "/games");
            const games = await res.json();

            const container = document.getElementById("gamesList");
            container.innerHTML = "";

            for (let game of games) {
                const playersRes = await fetch(API + `/games/${game.GID}/players`);
                const players = await playersRes.json();

                const names = players.map(p => p.Username.toLowerCase());
                const isCreator = game.CreatedBy && username && game.CreatedBy.toLowerCase() === username;

                const div = document.createElement("div");
                div.className = "game-card";

                div.innerHTML = `
        <h3>${game.Location}</h3>
        <p>${new Date(game.GameTime).toLocaleString()}</p>

        <p>Players (${names.length}): ${names.join(", ")}</p>

        ${username && !names.includes(username) ? `<button onclick="joinGame(${game.GID})">Join</button>` : ""}
        ${names.includes(username) ? `<button onclick="leaveGame(${game.GID})">Leave</button>` : ""}

        ${isCreator ? `<button class="primary" onclick="startSubGame(${game.GID})">Start Game</button>` : ""}
        ${isCreator ? `<button class="danger" onclick="deleteGame(${game.GID})">Delete</button>` : ""}
        ${isCreator ? `<button onclick="finishEvent(${game.GID})">Finish Event</button>` : ""}

        <button onclick="openChat(${game.GID})">Open Chat</button>
        `;

                container.appendChild(div);
            }
        }

        /* CHAT */
        function openChat(id) {
            currentChatGame = id;
            loadChat();
        }

        async function loadChat() {
            if (!currentChatGame) return;

            const res = await fetch(API + `/games/${currentChatGame}/chat`);
            const messages = await res.json();

            document.getElementById("chatBox").innerHTML =
                messages.map(m => `<div><b>${m.Username}:</b> ${m.Content}</div>`).join("");
        }

        async function sendMessage() {
            const input = document.getElementById("chatInput");
            const content = input.value;

            if (!content) return;

            await fetch(API + `/games/${currentChatGame}/chat`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, content })
            });

            input.value = "";
            loadChat();
        }

        /* RESET */
        async function resetAll() {
            await fetch(API + "/games/reset", { method: "DELETE" });
            loadGames();
            loadLeaderboard();
            loadHistory();
        }

        /* CREATE */
        async function createGame() {
            const location = document.getElementById("location").value;
            const time = document.getElementById("time").value;

            const res = await fetch(API + "/games", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ location, time, username })
            });

            const data = await res.json();

            if (data.error) {
                alert(data.error);
                return;
            }

            loadGames();
        }

        async function joinGame(id) {
            await fetch(API + `/games/${id}/join`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username })
            });
            loadGames();
        }

        async function leaveGame(id) {
            await fetch(API + `/games/${id}/leave`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username })
            });
            loadGames();
        }

        async function deleteGame(id) {
            await fetch(API + `/games/${id}/delete`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username })
            });
            loadGames();
        }

        async function finishEvent(id) {
            await fetch(API + `/games/${id}/finish`, {
                method: "POST"
            });

            loadGames();
            loadLeaderboard();
        }

        async function recordResult() {
            const gameId = document.getElementById("matchGameId").value;
            const winner = document.getElementById("winnerInput").value.toLowerCase();
            const players = document.getElementById("playersInput").value
                .split(",")
                .map(p => p.trim().toLowerCase());
            const score = document.getElementById("scoreInput").value;

            if (!gameId || !winner || players.length === 0 || !score) {
                alert("Fill out all fields!");
                return;
            }

            await fetch(API + `/games/${gameId}/result`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ winner, players, score })
            });

            alert("Match recorded!");

            loadGames();
            loadLeaderboard();
            loadHistory();
        }

        /* LEADERBOARD */
        async function loadLeaderboard() {
            const res = await fetch(API + "/games");
            const games = await res.json();

            const completed = games.filter(g => g.Status === "completed");

            if (completed.length === 0) {
                document.getElementById("leaderboard").innerHTML =
                    "<p>Leaderboard appears after events are completed.</p>";
                return;
            }

            const lb = await fetch(API + "/games/leaderboard");
            const data = await lb.json();

            document.getElementById("leaderboard").innerHTML =
                data.map(p => `<div class="leaderboard-card">${p.Username} - ${p.wins}</div>`).join("");
        }

        /* HISTORY */
        async function loadHistory() {
            const res = await fetch(API + "/games/history");
            const games = await res.json();

            document.getElementById("history").innerHTML =
                games.map(g => `
        <div class="history-card">
            <b>${g.location}</b><br>
            ${g.players.join(", ")}<br>
            Winner: <span style="color:green">${g.winner}</span><br>
Score: ${g.score || "N/A"}
        </div>
        `).join("");
        }

    </script>

</body>

</html>
